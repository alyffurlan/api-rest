<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <title>NASA API — Mission Control</title>
</head>
<body>
  <!-- Starfield canvas -->
  <canvas id="stars"></canvas>

  <!-- Nebula glow blobs -->
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

  <!-- Scanline overlay -->
  <div class="scanlines"></div>

  <header class="hud-header">
    <div class="hud-line"></div>
    <div class="header-content">
      <div class="nasa-logo">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
          <circle cx="30" cy="30" r="28" stroke="#00d4ff" stroke-width="1.5" fill="none"/>
          <ellipse cx="30" cy="30" rx="28" ry="10" stroke="#00d4ff" stroke-width="1" fill="none"/>
          <circle cx="30" cy="30" r="5" fill="#00d4ff" opacity="0.8"/>
          <line x1="2" y1="30" x2="58" y2="30" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
        </svg>
      </div>
      <div class="header-text">
        <span class="mission-tag">MISSION CONTROL</span>
        <h1 class="site-title">NASA API</h1>
        <span class="subtitle">DEEP SPACE INTERFACE v4.2.1</span>
      </div>
      <div class="status-indicators">
        <div class="indicator active"><span class="dot"></span>SYSTEM ONLINE</div>
        <div class="indicator"><span class="dot warn"></span>LINK ESTABLISHED</div>
      </div>
    </div>
    <div class="hud-line"></div>
  </header>

  <section id="main-sect">
    <!-- Decorative grid lines -->
    <div class="grid-corner top-left"></div>
    <div class="grid-corner top-right"></div>
    <div class="grid-corner bottom-left"></div>
    <div class="grid-corner bottom-right"></div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">REQUEST CONFIGURATION</span>
        <div class="panel-dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="control-group">
        <label class="control-label" for="http_method_select">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
            <polygon points="6,0 12,12 0,12"/>
          </svg>
          HTTP METHOD
        </label>
        <div class="select-wrapper">
          <select name="http-method-select" id="http_method_select">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
          <div class="select-arrow">▾</div>
        </div>
        <div class="method-badge GET" id="method-badge">GET</div>
      </div>

      <div class="control-group">
        <label class="control-label" for="endpoint-input">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
            <polygon points="6,0 12,12 0,12"/>
          </svg>
          ENDPOINT
        </label>
        <input style="opacity: 0.5;" type="text" id="endpoint-input" class="space-input" placeholder="/api/v1/apod" value="/api/v1/apod" disabled/>
      </div>

      <div class="control-group request-body">
        <label class="control-label" for="body-input">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
            <polygon points="6,0 12,12 0,12"/>
          </svg>
          REQUEST BODY
        </label>
        <textarea id="body-input" class="space-input space-textarea" placeholder='{"date": "2024-01-01"}'></textarea>
      </div>

      <button class="launch-btn" id="launch-btn">
        <span class="btn-glow"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L12 8M12 2L8 6M12 2L16 6"/>
          <path d="M5 10c0 5.523 3.134 10.343 7 12.343C15.866 20.343 19 15.523 19 10V8H5v2z"/>
          <circle cx="12" cy="13" r="2"/>
        </svg>
        LAUNCH REQUEST
      </button>

      <div class="panel-footer">
        <span>T+<span id="mission-clock">00:00:00</span></span>
        <span>LAT 28.5°N · LON 80.6°W</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">RESPONSE</span>
        <div class="panel-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
      <br>

      <div class="response-panel" id="response-panel">
        <div class="response-header">
          <span class="response-label">TELEMETRY RESPONSE</span>
          <span class="response-status" id="response-status"></span>
        </div>
        <pre id="response-output" class="response-output">// Awaiting signal from deep space...</pre>
      </div>

      <div class="panel-footer">
        <span>T+<span id="mission-clock">00:00:00</span></span>
        <span>LAT 28.5°N · LON 80.6°W</span>
      </div>
    </div>
  </section>

  <script src="js/styler.js"></script>
  <script src="js/endpointManager.js"></script>
</body>
</html>
