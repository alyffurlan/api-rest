<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <title>NASA API — Controle de Missão</title>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>
  <div class="scanlines"></div>

  <header class="hud-header">
    <div class="hud-line"></div>
    <div class="header-content">
      <div class="nasa-logo">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
          <circle cx="30" cy="30" r="28" stroke="#00d4ff" stroke-width="1.5" fill="none"/>
          <ellipse cx="30" cy="30" rx="28" ry="10" stroke="#00d4ff" stroke-width="1" fill="none"/>
          <circle cx="30" cy="30" r="5" fill="#00d4ff" opacity="0.8"/>
          <line x1="2" y1="30" x2="58" y2="30" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
        </svg>
      </div>
      <div class="header-text">
        <span class="mission-tag">CONTROLE DE MISSÃO</span>
        <h1 class="site-title">NASA API</h1>
        <span class="subtitle">INTERFACE ESPACIAL PROFUNDA v4.2.1</span>
      </div>
      <div class="status-indicators">
        <div class="indicator active"><span class="dot"></span>SISTEMA ONLINE</div>
        <div class="indicator"><span class="dot warn"></span>LINK ESTABELECIDO</div>
      </div>
    </div>
    <div class="hud-line"></div>
  </header>

  <section id="main-sect">
    <div class="grid-corner top-left"></div>
    <div class="grid-corner top-right"></div>
    <div class="grid-corner bottom-left"></div>
    <div class="grid-corner bottom-right"></div>

    <!-- REQUEST PANEL -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">CONFIGURAÇÃO DA REQUISIÇÃO</span>
        <div class="panel-dots"><span></span><span></span><span></span></div>
      </div>

      <!-- Seletor de recurso -->
      <div class="control-group">
        <label class="control-label">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="6,0 12,12 0,12"/></svg>
          RECURSO
        </label>
        <div class="resource-toggle">
          <button class="resource-btn active" data-resource="locations" id="btn-locations">LOCAIS</button>
          <button class="resource-btn" data-resource="impacts" id="btn-impacts">IMPACTOS</button>
        </div>
      </div>

      <!-- Método HTTP -->
      <div class="control-group">
        <label class="control-label" for="http_method_select">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="6,0 12,12 0,12"/></svg>
          MÉTODO HTTP
        </label>
        <div class="select-wrapper">
          <select name="http-method-select" id="http_method_select">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
          <div class="select-arrow">▾</div>
        </div>
        <div class="method-badge GET" id="method-badge">GET</div>
      </div>

      <!-- Endpoint (somente leitura, gerado automaticamente) -->
      <div class="control-group">
        <label class="control-label">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><polygon points="6,0 12,12 0,12"/></svg>
          ENDPOINT
        </label>
        <input type="text" id="endpoint-input" class="space-input" readonly/>
      </div>

      <!-- Campos dinâmicos -->
      <div id="dynamic-fields"></div>

      <button class="launch-btn" id="launch-btn">
        <span class="btn-glow"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L12 8M12 2L8 6M12 2L16 6"/>
          <path d="M5 10c0 5.523 3.134 10.343 7 12.343C15.866 20.343 19 15.523 19 10V8H5v2z"/>
          <circle cx="12" cy="13" r="2"/>
        </svg>
        ENVIAR REQUISIÇÃO
      </button>

      <div class="panel-footer">
        <span>T+<span id="mission-clock">00:00:00</span></span>
        <span>LAT 28.5°N · LON 80.6°W</span>
      </div>
    </div>

    <!-- PAINEL DE RESPOSTA -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">RESPOSTA</span>
        <div class="panel-dots"><span></span><span></span><span></span></div>
      </div>
      <br>
      <div class="response-panel" id="response-panel">
        <div class="response-header">
          <span class="response-label">RESPOSTA DE TELEMETRIA</span>
          <span class="response-status" id="response-status"></span>
        </div>
        <pre id="response-output" class="response-output">// Aguardando sinal do espaço profundo...</pre>
      </div>
      <div class="panel-footer">
        <span>T+<span id="mission-clock-2">00:00:00</span></span>
        <span>LAT 28.5°N · LON 80.6°W</span>
      </div>
    </div>
  </section>

  <script src="js/styler.js"></script>
  <script src="../model/endpointManager.js"></script>
</body>
</html>
